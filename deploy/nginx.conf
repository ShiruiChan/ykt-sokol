# /etc/nginx/sites-available/ykt-sokol
# DOMAIN.RU заменить на боевой домен (см. deploy/README.md).
# HTTPS добавит certbot --nginx: он допишет listen 443 ssl и редирект с http.

server {
	listen 80;
	listen [::]:80;
	server_name DOMAIN.RU www.DOMAIN.RU;

	root /srv/ykt-sokol/current;
	charset utf-8;
	server_tokens off;
	# PDF до 20 МБ через админку
	client_max_body_size 21m;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

	# Один адрес сайта: www → без www
	if ($host = www.DOMAIN.RU) {
		return 301 https://DOMAIN.RU$request_uri;
	}

	# Без слэша на конце и без .html в адресе
	rewrite ^/(.+)/$ /$1 permanent;
	location = /index.html {
		return 301 /;
	}
	location ~ ^/(.+)\.html$ {
		return 301 /$1;
	}

	# Старые адреса моделей
	location = /product/1 { return 301 /models/pickup-1-5; }
	location = /product/2 { return 301 /models/pickup-1-8; }
	location = /product/3 { return 301 /models/sokol-plus-timken; }
	location = /product/4 { return 301 /models/sokol-plus-timken; }
	location = /product/5 { return 301 /models/sokol-pro-plus; }
	location = /product/6 { return 301 /models/lis; }
	location = /models/sokol-plus-jimny { return 301 /models/sokol-plus-timken; }

	# Страницы: /gallery → gallery.html; неизвестный адрес → 404.html с кодом 404
	error_page 404 /404;
	location = / {
		include snippets/ykt-sokol-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files /index.html =404;
	}
	location / {
		include snippets/ykt-sokol-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri.html =404;
	}

	location /admin {
		include snippets/ykt-sokol-headers.conf;
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header Cache-Control "no-store" always;
		try_files $uri $uri.html =404;
	}

	# Файлы сборки с хэшем в имени — навсегда
	location ~ ^/(assets|fonts)/ {
		include snippets/ykt-sokol-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location ~ ^/(images|gallery|news|documents)/ {
		include snippets/ykt-sokol-headers.conf;
		add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
		try_files $uri =404;
	}

	# Фото и PDF из админки — лежат вне сборки, переживают любые пересборки
	location /uploads/ {
		alias /srv/ykt-sokol/uploads/;
		include snippets/ykt-sokol-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		# Заголовки перезаписываем: подставленные клиентом X-Forwarded-* не доходят до API
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}

	# Служебное — наружу не отдаём
	location = /api/health { return 404; }
	location ~ /\.(?!well-known/) { deny all; }
}
